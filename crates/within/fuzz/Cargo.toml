[package]
name = "within-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1", features = ["use-std"] }

[dependencies.within]
path = ".."

[[bin]]
name = "preconditioner_from_bytes"
path = "fuzz_targets/preconditioner_from_bytes.rs"
test = false
doc = false
bench = false

[workspace]
